<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2FF4D" />
      <stop offset="100%" stop-color="#A3FF12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#A3FF12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#262626" stroke-width="8" />
  
  <!-- Subtle Grid Pattern Accent -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="#141414" stroke="#1F1F1F" stroke-width="4" />

  <!-- Neon Dumbbell Graphic -->
  <g filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="190" y="240" width="132" height="32" rx="16" fill="url(#limeGrad)" />
    
    <!-- Inner Plates Left -->
    <rect x="156" y="170" width="28" height="172" rx="14" fill="url(#limeGrad)" />
    <!-- Outer Plates Left -->
    <rect x="114" y="196" width="30" height="120" rx="15" fill="url(#limeGrad)" />
    
    <!-- Inner Plates Right -->
    <rect x="328" y="170" width="28" height="172" rx="14" fill="url(#limeGrad)" />
    <!-- Outer Plates Right -->
    <rect x="368" y="196" width="30" height="120" rx="15" fill="url(#limeGrad)" />
  </g>

  <!-- PPL Text Badge Bottom -->
  <rect x="160" y="380" width="192" height="44" rx="22" fill="#1F1F1F" stroke="#333333" stroke-width="2" />
  <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#A3FF12" text-anchor="middle" letter-spacing="4">PUSH PULL LEGS</text>
</svg>
